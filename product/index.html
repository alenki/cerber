<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="/src/css/BootstrapSASS.css">
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/product.css">
    <title>Document</title>
</head>
<body>
    <div class="container d-flex pt-5 mt-5">
        <div class="gallery_column" id="gallery_column"></div>
        <div class="product_info pt-5 ps-5">
            <span class="product_title mb-1">БЕЖЕВАЯ ФУТБОЛКА INVESTMENT TEE</span>
            <br>
            <span class="product_details">Футболка свободного кроя из 100% премиального хлопка повышенной плотности с принтом на груди и на спине.</span><br>
            <span class="product_price">2 700 р.</span><br class="mt-3">
            <div class="product_size pt-3">
                <span class="">Размер</span> <br>
                <div class="size_wrapper mt-2 d-flex">
                    <div class="size_box" id="size_box_s">S</div>
                    <div class="size_box ms-2" id="size_box_m">M</div>
                    <div class="size_box size_box_active ms-2" id="size_box_l">L</div>
                    <div class="size_box ms-2" id="size_box_xl">XL</div>
                </div>
            </div>
            <br>
            <a href="" class="buy_button mt-2"><div class="d-flex align-items-center" style="height: 100%;">КУПИТЬ</div></a>
        </div>
    </div>

    <script type="module" src="/src/js/product.js"></script>
</body>
</html>
