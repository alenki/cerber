<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS -->
    <link rel="stylesheet" href="/src/css/BootstrapSASS.css">
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <title>cerber.</title>

  <body>
    <!-- Header -->
    <header class="d-flex justify-content-center">
      <nav class="navbar row d-flex align-content-center">
        <a href="#" class="col-1 d-flex justify-content-end" style="text-decoration: none; color: black;">
          <i load-hicon="arrow-up-circle" class="arrow_up" style="width: 41px; height: 41px; display: none;"></i>
        </a>
          <div class="col-10 d-flex justify-content-center align-items-center">
            <a href="#contacts" class="nav_link px-4">КОНТАКТЫ</a>
            <a href="#" class="nav_logo">
              <img src="/cerber.png" alt="cerber">
            </a>
            <div class="nav_link about_button px-4">О БРЕНДЕ</div>
          </div>
        <div class="col-1"></div>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
      <div class="background">
        <img src="/background.png" alt="cerber">
      </div>
      <div class="hero_main pb-5 mb-5">
        <!-- Logo -->
        <div class="logo pb-5">
          <img src="/cerber.png" alt="cerber">
        </div>
        <span class="hero_text">
          ГОРЫ. УЛИЦЫ. <br> ТВОЯ ИДЕНТИЧНОСТЬ
        </span>
      </div>
    </section>
    

    <!-- Collection -->
    <section class="bg-white collection" id="collection">
      <div class="container">
        <h2 class="collection_heading text-dark pt-5 mt-3">НОВАЯ КОЛЛЕКЦИЯ</h2>
        <div class="row" id="collection_items"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="" id="contacts">
      <div class="footer-container container pt-4 d-flex text-light" style="height: 100%;">
        <div class="row" style="width: 100%;">
          <div class="col-4 pt-4">
            <a href="https://okaraf.ru" class="karaf_tag" target="_blank">MADE BY
              <br>
              <span style="font-size: 2.1rem;">KARAF</span></a>
          </div>
          <div class="col-4 d-flex justify-content-center">
            <div class="">
              <span class="footer_main_text">enjoy yourself with</span>
              <div class="footer_logo mt-2">
                <img src="/cerber_light.png" alt="cerber">
              </div>
            </div>
          </div>
          <div class="col-4 d-flex justify-content-end">
            <div class="pt-2">
              <a href="mailto::contact@cerber.com" class="footer_link d-flex align-items-center">
                <div class="footer_icon me-2">
                  <i load-hicon="email" style="width: 24px; height: 24px; color: black;"></i>
                </div>
                contact@cerber.com
              </a> <br>
              <a href="https://t.me/cerber_nlc" class="footer_link d-flex align-items-center" target="_blank">
                <div class="footer_icon me-2">
                  <i load-hicon="send" style="width: 24px; height: 24px; color: black;"></i>
                </div>
                @cerber_nlc
              </a> <br>
              <a href="https://www.instagram.com/cerber.nlc/" class="footer_link d-flex align-items-center" target="_blank">
                <div class="footer_icon me-2">
                  <i load-hicon="instagram" style="width: 24px; height: 24px; color: black;"></i>
                </div>
                @cerber.nlc
              </a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- About Modal -->
  <div class="modal fade" data-lenis-prevent id="aboutModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="custom-modal-content modal-content">
        <div class="custom-modal-header modal-header text-light" data-bs-theme="dark">
            <h2 class="custom-modal-title modal-title fs-5" id="enrollLabel">О БРЕНДЕ</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-light">
          <span>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Accusantium molestias perferendis, accusamus natus sunt ratione.</span>
        </div>
      </div>
    </div>

    <!-- Hicon -->
    <script src="https://cdn.jsdelivr.net/gh/coswise/hicon-js@latest/hicon.min.js"></script>
    <script>
      hicon.replace();
    </script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
